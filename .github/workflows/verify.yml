name: verify

# AGENTS.md carries the rules; this gives them a runtime. A rule written in a
# document does not bind anything (AST-09), and check_agents.py had no trigger
# until this file existed.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # External links are checked weekly rather than per push. They need the
    # network, and a transient outage failing every commit would be a false
    # positive, which in a monitoring tool costs more than a miss (E26).
    - cron: "0 6 * * 1"

jobs:
  document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # INV-01 compares HEAD to origin/main, so the full history and the
          # remote ref have to be present.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: verify AGENTS.md against the committed tree
        run: |
          # The verifier returns three codes and a step has room for two. On a
          # pull request the checkout is a merge commit, so INV-01 (HEAD equals
          # origin/main) is false by construction, for a reason that says
          # nothing about the change under review, and the verifier returns 2.
          # That code means every value holds and the tree is not published,
          # which is the expected state for a pull request rather than a
          # failure. Accepting it here masks nothing: 2 is returned only when
          # INV-01 is the sole failure, and any real disagreement returns 1
          # ahead of it. See E72.
          #
          # `|| status=$?` rather than a bare call: the default shell runs with
          # -e, so a non-zero exit would abort before the code could be read.
          status=0
          python check_agents.py || status=$?
          # TEMPORAIRE: acceptation retiree pour temoigner le rouge.
          exit "$status"

  external-links:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: every external link serves real content
        run: python check_agents.py --extlinks
